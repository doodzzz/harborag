# Harbor Airgapped Deployment Configuration
# All paths must exist on the target Photon OS host before running the script.

harbor:
  hostname: registry.example.com      # FQDN for Harbor; must resolve on the host
  http_port: 80
  https_port: 443
  admin_password: "Harbor12345!"      # Initial admin password
  data_volume: /data/harbor           # Persistent storage path for Harbor data

installer:
  offline_package: /opt/packages/harbor-offline-installer-v2.10.2.tgz
  install_dir: /opt                   # Harbor will be extracted to <install_dir>/harbor

certificates:
  ca_cert: /opt/certs/ca.crt
  server_cert: /opt/certs/server.crt
  server_key: /opt/certs/server.key

database:
  password: "DBpassword123"

packages:
  # Paths to pre-downloaded RPM files (airgapped — no network access)
  docker_rpms:
    - /opt/packages/docker-25.0.6-1.ph5.x86_64.rpm
    - /opt/packages/containerd-1.7.13-1.ph5.x86_64.rpm
    - /opt/packages/docker-cli-25.0.6-1.ph5.x86_64.rpm
  # Standalone docker-compose v2 binary (pre-downloaded)
  docker_compose_binary: /opt/packages/docker-compose-linux-x86_64

components:
  trivy: false        # Vulnerability scanner
  notary: false       # Content trust / image signing
  chartmuseum: false  # Helm chart repository

systemd:
  enable_service: true   # Register Harbor as a systemd service (auto-start on boot)
